<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR Topos — Topos de Bolo Personalizados</title>

  <!--
    CONFIGURAÇÃO — faça antes de publicar

    1. No Supabase, em Project Settings > API, copie:
       - Project URL para SUPABASE_URL
       - anon/public key para SUPABASE_ANON_KEY
       Nunca use a chave service_role neste arquivo.

    2. Troque ADMIN_EMAIL pelo e-mail exato do usuário administrador.

    3. No Supabase > SQL Editor, troque admin@exemplo.com pelo mesmo e-mail
       e execute este SQL:

       create table if not exists public.products (
         id bigint generated by default as identity primary key,
         name text not null,
         description text not null,
         price numeric(10,2) not null default 0,
         category text not null,
         image text not null
       );

       alter table public.products enable row level security;

       drop policy if exists "Produtos visíveis publicamente" on public.products;
       create policy "Produtos visíveis publicamente"
       on public.products for select to anon, authenticated
       using (true);

       drop policy if exists "Administrador pode inserir produtos" on public.products;
       create policy "Administrador pode inserir produtos"
       on public.products for insert to authenticated
       with check (lower(auth.jwt() ->> 'email') = 'admin@exemplo.com');

       drop policy if exists "Administrador pode editar produtos" on public.products;
       create policy "Administrador pode editar produtos"
       on public.products for update to authenticated
       using (lower(auth.jwt() ->> 'email') = 'admin@exemplo.com')
       with check (lower(auth.jwt() ->> 'email') = 'admin@exemplo.com');

       drop policy if exists "Administrador pode excluir produtos" on public.products;
       create policy "Administrador pode excluir produtos"
       on public.products for delete to authenticated
       using (lower(auth.jwt() ->> 'email') = 'admin@exemplo.com');

       grant select on public.products to anon, authenticated;
       grant insert, update, delete on public.products to authenticated;

    4. No Supabase, abra Authentication > URL Configuration:
       Site URL:
       https://joseronaldojr420-cmyk.github.io/Jr-topos/

       Adicione também essa mesma URL em Redirect URLs.

    5. Em Authentication > Users, crie o usuário administrador com o e-mail
       configurado acima. Se a confirmação de e-mail estiver ligada, confirme
       o endereço antes de entrar no site.
  -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: #f5f7fa; color: #1a1a1a; }
    button, input, textarea { font: inherit; }
    .header { position: sticky; top: 0; z-index: 5; background: linear-gradient(135deg, #1F3A5F, #2d5a8f); color: white; padding: 1rem; }
    .header-inner { max-width: 1200px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .logo { font-size: 1.6rem; font-weight: 800; }
    .logo span, .accent { color: #E8A33D; }
    .btn { border: 0; border-radius: 8px; padding: .7rem 1rem; cursor: pointer; font-weight: 700; }
    .btn-admin { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35); color: white; }
    .btn-primary { background: #E8A33D; color: #17283e; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .hero { padding: 4rem 1rem; text-align: center; color: white; background: linear-gradient(135deg, #1F3A5F, #2d5a8f); }
    .hero h1 { margin: 0 0 .8rem; font-size: clamp(2rem, 5vw, 3.4rem); }
    .hero p { margin: 0 auto; max-width: 680px; opacity: .92; line-height: 1.6; }
    .container { max-width: 1200px; margin: auto; padding: 2rem 1rem; }
    #adminBar { display: none; margin-bottom: 1.2rem; padding: 1rem; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; background: #eaf0f7; border: 1px solid #cbd8e7; border-radius: 12px; }
    .admin-label { color: #1F3A5F; font-weight: 800; }
    .admin-actions, .product-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    .notice { display: none; margin-bottom: 1rem; padding: .9rem 1rem; border-radius: 8px; background: #fff7ed; color: #9a3412; line-height: 1.5; }
    .filters { display: flex; justify-content: center; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
    .filter-btn { padding: .5rem 1rem; border: 2px solid #1F3A5F; border-radius: 24px; background: white; color: #1F3A5F; cursor: pointer; font-weight: 700; }
    .filter-btn.active { background: #1F3A5F; color: white; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.3rem; }
    .product-card { display: flex; flex-direction: column; overflow: hidden; background: white; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,.08); }
    .product-img { width: 100%; height: 210px; object-fit: cover; background: #e5e7eb; }
    .product-body { display: flex; flex: 1; flex-direction: column; padding: 1rem; }
    .product-cat { align-self: flex-start; margin-bottom: .5rem; padding: .25rem .65rem; border-radius: 14px; background: #eef2ff; color: #1F3A5F; font-size: .75rem; font-weight: 800; }
    .product-name { margin: 0 0 .5rem; font-size: 1.15rem; }
    .product-desc { flex: 1; margin: 0 0 1rem; color: #6b7280; line-height: 1.5; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .6rem; }
    .product-price { color: #1F3A5F; font-size: 1.2rem; font-weight: 800; }
    .order-btn { padding: .55rem .7rem; border-radius: 7px; background: #25D366; color: #073b1b; text-decoration: none; font-size: .82rem; font-weight: 800; }
    .action-btn { border: 0; border-radius: 6px; padding: .45rem .7rem; color: white; cursor: pointer; font-weight: 700; }
    .edit-btn { background: #3B82F6; }
    .delete-btn { background: #EF4444; }
    .empty-state { grid-column: 1 / -1; padding: 2.5rem 1rem; text-align: center; color: #6b7280; }
    .footer { margin-top: 2rem; padding: 1.5rem; background: #1F3A5F; color: white; text-align: center; }
    .modal-overlay { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 1rem; background: rgba(0,0,0,.6); }
    .modal-overlay.open { display: flex; }
    .modal { width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; padding: 1.5rem; border-radius: 14px; background: white; }
    .modal h2 { margin: 0 0 1.2rem; color: #1F3A5F; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: .35rem; font-weight: 700; }
    .form-group input, .form-group textarea { width: 100%; padding: .7rem; border: 1px solid #cbd5e1; border-radius: 7px; }
    .form-group textarea { min-height: 85px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1rem; }
    .error { min-height: 1.2rem; color: #b91c1c; }
    @media (max-width: 600px) {
      .hero { padding: 2.8rem 1rem; }
      .container { padding: 1.2rem .8rem; }
      .product-img { height: 185px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">JR <span>Topos</span></div>
      <button class="btn btn-admin" id="openLogin" type="button">Área do Admin</button>
    </div>
  </header>

  <section class="hero">
    <h1>Topos de Bolo <span class="accent">Personalizados</span></h1>
    <p>Transforme sua festa em um momento único com nossos topos exclusivos e feitos com carinho.</p>
  </section>

  <main class="container">
    <div id="adminBar">
      <span class="admin-label">Área administrativa ativa</span>
      <div class="admin-actions">
        <button class="btn btn-primary" id="newProduct" type="button">+ Novo Produto</button>
        <button class="btn btn-secondary" id="logout" type="button">Sair</button>
      </div>
    </div>
    <div class="notice" id="notice" role="alert"></div>
    <div class="filters" id="filters"></div>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <div class="modal-overlay" id="loginModal">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <h2 id="loginTitle">Entrar na área administrativa</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input id="loginEmail" type="email" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </div>
        <p class="error" id="loginError" role="alert"></p>
        <div class="modal-actions">
          <button class="btn btn-secondary close-login" type="button">Fechar</button>
          <button class="btn btn-primary" id="loginSubmit" type="submit">Entrar</button>
        </div>
      </form>
    </section>
  </div>

  <div class="modal-overlay" id="productModal">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
      <h2 id="productModalTitle">Cadastrar produto</h2>
      <form id="productForm">
        <div class="form-group">
          <label for="pName">Nome do produto</label>
          <input id="pName" required>
        </div>
        <div class="form-group">
          <label for="pDesc">Descrição</label>
          <textarea id="pDesc" required></textarea>
        </div>
        <div class="form-group">
          <label for="pPrice">Preço (R$)</label>
          <input id="pPrice" type="number" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="pCat">Categoria</label>
          <input id="pCat" required>
        </div>
        <div class="form-group">
          <label for="pImage">URL da imagem (HTTPS)</label>
          <input id="pImage" type="url" placeholder="https://..." required>
        </div>
        <p class="error" id="productError" role="alert"></p>
        <div class="modal-actions">
          <button class="btn btn-secondary close-product" type="button">Cancelar</button>
          <button class="btn btn-primary" id="saveProduct" type="submit">Salvar produto</button>
        </div>
      </form>
    </section>
  </div>

  <footer class="footer">
    <p>JR Topos — Topos de Bolo Personalizados. Todos os direitos reservados.</p>
  </footer>

  <script>
    // Substitua estes três valores antes de publicar.
    const SUPABASE_URL = "COLE_A_URL_DO_PROJETO";
    const SUPABASE_ANON_KEY = "COLE_A_CHAVE_ANON_PUBLIC";
    const ADMIN_EMAIL = "SEU_EMAIL_ADMIN".toLowerCase();

    const sampleProducts = [
      { name: "Topo Carro de Corrida", description: "Topo temático com carro esportivo. Ideal para festas infantis.", price: 35, category: "Esportivo", image: "https://images.unsplash.com/photo-1544636331-e26879cd4d9b?w=800&h=600&fit=crop" },
      { name: "Topo Bola de Futebol", description: "Topo clássico com bola de futebol em alto-relevo.", price: 28, category: "Esportivo", image: "https://images.unsplash.com/photo-1551958219-acbc608c6377?w=800&h=600&fit=crop" },
      { name: "Topo Ursinho de Pelúcia", description: "Ursinho fofo com laço azul, feito em material resistente.", price: 32, category: "Infantil", image: "https://images.unsplash.com/photo-1559715541-5daf8a0296d0?w=800&h=600&fit=crop" },
      { name: "Topo Controle Gamer", description: "Controle de videogame para festas com tema gamer.", price: 38, category: "Gamer", image: "https://images.unsplash.com/photo-1592840496011-b8050407612a?w=800&h=600&fit=crop" },
      { name: "Topo Estrela Brilhante", description: "Estrela decorativa com acabamento metalizado.", price: 25, category: "Aniversário", image: "https://images.unsplash.com/photo-1464349153459-f0199f1d3c4f?w=800&h=600&fit=crop" },
      { name: "Topo Bolo de Casamento", description: "Topo elegante com noivos e coração.", price: 55, category: "Casamento", image: "https://images.unsplash.com/photo-1535254973040-607b474cb50d?w=800&h=600&fit=crop" }
    ];

    let supabaseClient = null;
    let products = [];
    let activeFilter = "Todos";
    let isAdmin = false;
    let editingId = null;

    const $ = id => document.getElementById(id);

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function showNotice(message) {
      $("notice").textContent = message;
      $("notice").style.display = "block";
    }

    function hideNotice() {
      $("notice").style.display = "none";
    }

    function formatPrice(value) {
      return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number(value) || 0);
    }

    function renderFilters() {
      const categories = ["Todos", ...new Set(products.map(item => item.category).sort())];
      $("filters").innerHTML = categories.map(category =>
        `<button class="filter-btn ${category === activeFilter ? "active" : ""}" type="button" data-filter="${escapeHTML(category)}">${escapeHTML(category)}</button>`
      ).join("");

      $("filters").querySelectorAll("[data-filter]").forEach(button => {
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;
          renderFilters();
          renderProducts();
        });
      });
    }

    function renderProducts() {
      const visible = activeFilter === "Todos"
        ? products
        : products.filter(item => item.category === activeFilter);

      if (!visible.length) {
        $("productsGrid").innerHTML = '<div class="empty-state"><h3>Nenhum produto encontrado</h3><p>Os produtos cadastrados aparecerão aqui.</p></div>';
        return;
      }

      $("productsGrid").innerHTML = visible.map(product => {
        const message = encodeURIComponent(`Olá! Gostaria de pedir "${product.name}" por ${formatPrice(product.price)}.`);
        const actions = isAdmin ? `
          <div class="product-actions">
            <button class="action-btn edit-btn" type="button" data-edit="${Number(product.id)}">Editar</button>
            <button class="action-btn delete-btn" type="button" data-delete="${Number(product.id)}">Excluir</button>
          </div>` : "";

        return `
          <article class="product-card">
            <img class="product-img" src="${escapeHTML(product.image)}" alt="${escapeHTML(product.name)}">
            <div class="product-body">
              <span class="product-cat">${escapeHTML(product.category)}</span>
              <h3 class="product-name">${escapeHTML(product.name)}</h3>
              <p class="product-desc">${escapeHTML(product.description)}</p>
              <div class="product-footer">
                <span class="product-price">${formatPrice(product.price)}</span>
                <a class="order-btn" href="https://wa.me/5586981850405?text=${message}" target="_blank" rel="noopener noreferrer">Pedir pelo WhatsApp</a>
                ${actions}
              </div>
            </div>
          </article>`;
      }).join("");

      $("productsGrid").querySelectorAll("[data-edit]").forEach(button =>
        button.addEventListener("click", () => openProductModal(Number(button.dataset.edit)))
      );
      $("productsGrid").querySelectorAll("[data-delete]").forEach(button =>
        button.addEventListener("click", () => deleteProduct(Number(button.dataset.delete)))
      );
    }

    function setAdminMode(enabled) {
      isAdmin = enabled;
      $("adminBar").style.display = enabled ? "flex" : "none";
      renderProducts();
    }

    function openModal(id) {
      $(id).classList.add("open");
    }

    function closeModal(id) {
      $(id).classList.remove("open");
    }

    function openProductModal(id = null) {
      if (!isAdmin) return;
      editingId = id;
      $("productForm").reset();
      $("productError").textContent = "";
      $("productModalTitle").textContent = id ? "Editar produto" : "Cadastrar produto";

      if (id) {
        const product = products.find(item => Number(item.id) === id);
        if (product) {
          $("pName").value = product.name;
          $("pDesc").value = product.description;
          $("pPrice").value = product.price;
          $("pCat").value = product.category;
          $("pImage").value = product.image;
        }
      }
      openModal("productModal");
    }

    async function loadProducts() {
      hideNotice();
      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("id", { ascending: true });

      if (error) {
        console.error("Erro ao carregar produtos:", error);
        products = sampleProducts.map((item, index) => ({ ...item, id: index + 1 }));
        renderFilters();
        renderProducts();
        showNotice("Não foi possível carregar os produtos do Supabase. Confira a tabela products, a URL/chave do projeto e as políticas RLS.");
        return;
      }

      if (data.length === 0 && isAdmin) {
        const { error: seedError } = await supabaseClient.from("products").insert(sampleProducts);
        if (seedError) {
          console.error("Erro ao cadastrar produtos iniciais:", seedError);
          products = [];
          showNotice("O login funcionou, mas a inclusão inicial falhou. Confira a política de INSERT no Supabase.");
        } else {
          const result = await supabaseClient.from("products").select("*").order("id", { ascending: true });
          products = result.data || [];
        }
      } else {
        products = data.length
          ? data
          : sampleProducts.map((item, index) => ({ ...item, id: index + 1 }));
      }

      renderFilters();
      renderProducts();
    }

    $("openLogin").addEventListener("click", () => {
      $("loginError").textContent = "";
      openModal("loginModal");
    });

    document.querySelectorAll(".close-login").forEach(button =>
      button.addEventListener("click", () => closeModal("loginModal"))
    );
    document.querySelectorAll(".close-product").forEach(button =>
      button.addEventListener("click", () => closeModal("productModal"))
    );
    $("newProduct").addEventListener("click", () => openProductModal());
    $("logout").addEventListener("click", async () => {
      if (supabaseClient) await supabaseClient.auth.signOut();
      setAdminMode(false);
      await loadProducts();
    });

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const email = $("loginEmail").value.trim().toLowerCase();
      const password = $("loginPassword").value;
      const errorBox = $("loginError");
      const button = $("loginSubmit");

      errorBox.textContent = "";
      if (!supabaseClient) {
        errorBox.textContent = "Configure SUPABASE_URL e SUPABASE_ANON_KEY no index.html antes de entrar.";
        return;
      }

      button.disabled = true;
      button.textContent = "Entrando...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      button.disabled = false;
      button.textContent = "Entrar";

      if (error) {
        errorBox.textContent = "Login não realizado. Confira o e-mail, a senha e se o e-mail foi confirmado.";
        return;
      }

      if ((data.user.email || "").toLowerCase() !== ADMIN_EMAIL) {
        await supabaseClient.auth.signOut();
        errorBox.textContent = "Este usuário não está configurado como administrador no site.";
        return;
      }

      $("loginPassword").value = "";
      closeModal("loginModal");
      setAdminMode(true);
      await loadProducts();
    });

    $("productForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (!isAdmin || !supabaseClient) return;

      const product = {
        name: $("pName").value.trim(),
        description: $("pDesc").value.trim(),
        price: Number($("pPrice").value),
        category: $("pCat").value.trim(),
        image: $("pImage").value.trim()
      };

      if (!product.image.startsWith("https://")) {
        $("productError").textContent = "O endereço da imagem precisa começar com https://.";
        return;
      }

      const button = $("saveProduct");
      button.disabled = true;
      button.textContent = "Salvando...";

      const result = editingId
        ? await supabaseClient.from("products").update(product).eq("id", editingId)
        : await supabaseClient.from("products").insert(product);

      button.disabled = false;
      button.textContent = "Salvar produto";

      if (result.error) {
        console.error("Erro ao salvar produto:", result.error);
        $("productError").textContent = "Não foi possível salvar. Confira as políticas RLS e a tabela products.";
        return;
      }

      closeModal("productModal");
      await loadProducts();
    });

    async function deleteProduct(id) {
      if (!isAdmin || !confirm("Deseja excluir este produto?")) return;

      const { error } = await supabaseClient.from("products").delete().eq("id", id);
      if (error) {
        console.error("Erro ao excluir produto:", error);
        showNotice("Não foi possível excluir. Confira a política DELETE no Supabase.");
        return;
      }
      await loadProducts();
    }

    async function startSite() {
      const notConfigured =
        SUPABASE_URL.includes("COLE_") ||
        SUPABASE_ANON_KEY.includes("COLE_") ||
        ADMIN_EMAIL === "seu_email_admin";

      if (notConfigured) {
        products = sampleProducts.map((item, index) => ({ ...item, id: index + 1 }));
        renderFilters();
        renderProducts();
        showNotice("O catálogo está em modo de demonstração. Configure a URL, a chave anon/public e o e-mail do administrador no index.html para ativar o Supabase.");
        return;
      }

      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) console.error("Erro ao verificar sessão:", error);

        const email = data.session?.user?.email?.toLowerCase();
        if (email === ADMIN_EMAIL) {
          setAdminMode(true);
        } else if (data.session) {
          await supabaseClient.auth.signOut();
        }

        await loadProducts();
      } catch (error) {
        console.error("Erro ao iniciar Supabase:", error);
        products = sampleProducts.map((item, index) => ({ ...item, id: index + 1 }));
        renderFilters();
        renderProducts();
        showNotice("Não foi possível iniciar o Supabase. Verifique se a URL do projeto e a chave anon/public foram copiadas corretamente.");
      }
    }

    startSite();
  </script>
</body>
</html>
